{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm border-danger border-opacity-50">
                <div class="card-body p-4 text-center">
                    <div class="text-danger mb-3" style="font-size: 3.5rem;">
                        <i class="bi bi-trash3"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Удалить новость?</h4>
                    <p class="text-muted mb-4">
                        Вы уверены, что хотите удалить новость
                        <strong>«{{ news.title }}»</strong>?
                        <br>Это действие необратимо.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger fw-semibold">
                                <i class="bi bi-trash me-1"></i>Да, удалить
                            </button>
                            <a href="{% url 'news:admin_dashboard' %}"
                               class="btn btn-outline-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
